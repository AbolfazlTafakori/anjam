# /etc/nginx/sites-available/anjam — only answers for anjam.abolfazltafakori.com.
# Rate-limit zones live in /etc/nginx/conf.d/anjam-zones.conf with anjam_-prefixed names,
# so nothing here can clash with other sites on this server.
server {
    listen 80;
    listen [::]:80;
    server_name anjam.abolfazltafakori.com;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    client_max_body_size 8m;

    location /api/auth/ {
        limit_req zone=anjam_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        limit_req zone=anjam_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
