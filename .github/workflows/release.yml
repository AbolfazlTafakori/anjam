# Builds the desktop installers and publishes them to GitHub Releases whenever a v* tag is pushed.
# The server's download page and the in-app updater both read from these releases.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27', cache-dependency-path: backend/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build server binaries
        working-directory: backend
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X github.com/AbolfazlTafakori/anjam/backend/internal/config.Version=$VERSION" -o ../anjam-server-linux-$arch ./cmd/anjam
          done
      - name: Build web bundle
        run: npm ci --ignore-scripts && node scripts/build-web.js && tar -czf anjam-web.tar.gz -C web .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            anjam-server-linux-amd64
            anjam-server-linux-arm64
            anjam-web.tar.gz
  android:
    needs: [build, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - run: node scripts/build-web.js && npx cap sync android
      - name: Restore signing key
        run: echo "${{ secrets.ANJAM_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/anjam.keystore"
      - name: Build signed APK
        working-directory: android
        env:
          ANJAM_KEYSTORE: ${{ runner.temp }}/anjam.keystore
          ANJAM_KEYSTORE_PASSWORD: ${{ secrets.ANJAM_KEYSTORE_PASSWORD }}
          ANJAM_KEY_ALIAS: ${{ secrets.ANJAM_KEY_ALIAS }}
          ANJAM_KEY_PASSWORD: ${{ secrets.ANJAM_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon -q
      - name: Rename
        run: VERSION=${GITHUB_REF_NAME#v}; cp android/app/build/outputs/apk/release/app-release.apk "Anjam-$VERSION.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: Anjam-*.apk
