<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anjam · مدیریت</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { overflow: auto; user-select: text; }
    .adm { max-width: 1040px; margin: 0 auto; padding: 24px var(--gutter) 60px; display: flex; flex-direction: column; gap: 22px; }
    .adm-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .adm-head h1 { font-size: 22px; font-weight: 800; flex: 1; }
    .adm-head .who { color: var(--ink-3); font-size: 12.5px; }
    .login { max-width: 380px; margin: 12vh auto 0; display: flex; flex-direction: column; gap: 12px; }
    .login h1 { font-size: 20px; font-weight: 800; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: start; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; color: var(--ink-3); padding: 8px 6px; border-bottom: 1px solid var(--rule-strong); text-transform: uppercase; }
    td { padding: 9px 6px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
    td.num { font-variant-numeric: tabular-nums; color: var(--ink-2); }
    td .email { color: var(--ink-2); font-size: 12px; direction: ltr; unicode-bidi: isolate; text-align: start; display: block; }
    .badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-3); }
    .badge.admin { color: var(--gold); border-color: var(--rule-strong); }
    .badge.off { color: var(--danger); border-color: rgba(255,92,99,.4); }
    .actions { display: flex; gap: 4px; flex-wrap: wrap; }
    .actions .btn { height: 28px; padding: 0 10px; font-size: 12px; }
    .stat-line { display: flex; flex-wrap: wrap; gap: 6px 28px; padding: 12px 0; border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule); font-size: 13.5px; }
    .stat-line b { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
    .stat-line span { color: var(--ink-3); }
    .row-inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .row-inline .field-input { width: auto; flex: 1; min-width: 160px; }
    code { font-variant-numeric: tabular-nums; letter-spacing: .04em; font-size: 12.5px; color: var(--gold); background: rgba(0,0,0,.25); padding: 2px 6px; border-radius: 4px; direction: ltr; unicode-bidi: isolate; }
    .msg { font-size: 12.5px; color: var(--ink-3); } .msg.err { color: var(--danger); }
    .audit { font-size: 12px; color: var(--ink-2); display: grid; grid-template-columns: auto auto 1fr auto; gap: 4px 14px; }
    .audit span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .audit .ts { color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .table-wrap { overflow-x: auto; }
    @media (max-width: 700px) { .audit { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M4 19h16"/></symbol>
  <symbol id="i-lang" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3 3 3 14 0 17M12 3.5c-3 3-3 14 0 17"/></symbol>
</defs></svg>

<div class="adm" id="app">
  <div class="login" id="login">
    <div class="brand"><span class="brand-seal"><svg><use href="#i-check"/></svg></span><span class="brand-name">انجام</span></div>
    <h1 data-i18n="adminTitle">پنل مدیریت</h1>
    <input id="l-user" type="email" class="field-input" dir="ltr" placeholder="email@example.com" autocomplete="username" />
    <input id="l-pass" type="password" class="field-input" dir="ltr" data-i18n-ph="password" placeholder="رمز عبور" autocomplete="current-password" />
    <button class="btn primary" id="l-go" data-i18n="signIn">ورود</button>
    <div class="msg err" id="l-err"></div>
  </div>

  <div id="panel" hidden>
    <div class="adm-head">
      <div class="brand"><span class="brand-seal"><svg><use href="#i-check"/></svg></span><span class="brand-name">انجام</span></div>
      <h1 data-i18n="adminTitle">پنل مدیریت</h1>
      <span class="who" id="who"></span>
      <button class="ibtn" id="lang" title="فارسی / English"><svg><use href="#i-lang"/></svg></button>
      <a class="btn ghost" id="backup" href="#"><svg><use href="#i-download"/></svg><span data-i18n="backup">پشتیبان دیتابیس</span></a>
      <button class="btn ghost" id="pw-btn" data-i18n="changePw">تغییر رمز</button>
      <button class="btn ghost" id="logout" data-i18n="signOut">خروج</button>
    </div>
    <div class="panel" id="pw-panel" hidden>
      <h2 data-i18n="changePw">تغییر رمز</h2>
      <div class="row-inline"><input id="pw-cur" type="password" class="field-input" dir="ltr" data-i18n-ph="curPw" placeholder="رمز فعلی" /><input id="pw-new" type="password" class="field-input" dir="ltr" data-i18n-ph="newPw" placeholder="رمز جدید" /><button class="btn primary" id="pw-save" data-i18n="save">ذخیره</button><span class="msg" id="pw-msg"></span></div>
    </div>

    <div class="stat-line" id="stats"></div>

    <div class="panel">
      <h2 data-i18n="registration">ثبت‌نام</h2>
      <div class="row-inline">
        <div class="seg" id="reg" style="max-width:420px">
          <button data-v="open" data-i18n="regOpen">باز</button>
          <button data-v="invite" data-i18n="regInvite">فقط با کد دعوت</button>
          <button data-v="closed" data-i18n="regClosed">بسته</button>
        </div>
        <span class="msg" id="reg-msg"></span>
      </div>
    </div>

    <div class="panel">
      <h2 data-i18n="invites">کدهای دعوت</h2>
      <div class="row-inline"><input id="inv-note" class="field-input" dir="auto" data-i18n-ph="invNote" placeholder="یادداشت (مثلاً برای خانم)" /><button class="btn primary" id="inv-add" data-i18n="invCreate">ساخت کد</button></div>
      <div class="table-wrap"><table id="inv-table"><thead><tr><th data-i18n="code">کد</th><th data-i18n="note">یادداشت</th><th data-i18n="status">وضعیت</th><th></th></tr></thead><tbody></tbody></table></div>
    </div>

    <div class="panel">
      <h2 data-i18n="users">کاربران</h2>
      <div class="table-wrap"><table id="users"><thead><tr><th data-i18n="user">کاربر</th><th data-i18n="role">نقش</th><th data-i18n="tasks">کارها</th><th data-i18n="lists">لیست‌ها</th><th data-i18n="lastSync">آخرین همگام‌سازی</th><th data-i18n="joined">عضویت</th><th></th></tr></thead><tbody></tbody></table></div>
      <div class="msg" id="u-msg"></div>
    </div>

    <div class="panel">
      <h2 data-i18n="audit">رویدادها</h2>
      <div class="audit" id="audit"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const I = {
    fa: { adminTitle: 'پنل مدیریت', password: 'رمز عبور', username: 'نام کاربری', changePw: 'تغییر رمز', curPw: 'رمز فعلی', newPw: 'رمز جدید', active: 'فعال', errMany: 'تلاش زیاد؛ کمی بعد', errWeak: 'رمز ضعیف است (≥۸، حرف و عدد)', signIn: 'ورود', signOut: 'خروج', backup: 'پشتیبان دیتابیس', registration: 'ثبت‌نام', regOpen: 'باز', regInvite: 'فقط با کد دعوت', regClosed: 'بسته',
      invites: 'کدهای دعوت', invNote: 'یادداشت (مثلاً برای خانم)', invCreate: 'ساخت کد', code: 'کد', note: 'یادداشت', status: 'وضعیت', used: 'استفاده‌شده', unused: 'آزاد', users: 'کاربران', user: 'کاربر', role: 'نقش', tasks: 'کارها', lists: 'لیست‌ها', lastSync: 'آخرین همگام‌سازی', joined: 'عضویت', audit: 'رویدادها',
      admin: 'مدیر', disabled: 'غیرفعال', never: 'هرگز', disable: 'غیرفعال', enable: 'فعال', makeAdmin: 'مدیر کن', removeAdmin: 'مدیر نباشد', resetLink: 'لینک بازیابی رمز', wipe: 'پاک‌کردن داده‌ها', del: 'حذف', delete: 'حذف',
      confirmDel: 'کاربر و همه‌ی داده‌هایش حذف شود؟', confirmWipe: 'همه‌ی کارهای این کاربر پاک شود؟', linkMade: 'لینک ساخته شد (۲۴ ساعت اعتبار) — برای کاربر بفرستید:', saved: 'ذخیره شد', errCreds: 'ایمیل یا رمز اشتباه است', errForbidden: 'این حساب مدیر نیست', errNet: 'اتصال برقرار نشد',
      sUsers: 'کاربر', sAdmins: 'مدیر', sTasks: 'کار', sSignups: 'ثبت‌نام ۷ روز', sActive: 'فعال ۷ روز', sDb: 'دیتابیس', sMail: 'ایمیل', on: 'روشن', off: 'خاموش', copy: 'کپی' },
    en: { adminTitle: 'Admin panel', password: 'Password', username: 'Username', changePw: 'Change password', curPw: 'Current password', newPw: 'New password', active: 'active', errMany: 'Too many attempts', errWeak: 'Weak password (≥8, letters + digits)', signIn: 'Sign in', signOut: 'Sign out', backup: 'Database backup', registration: 'Registration', regOpen: 'Open', regInvite: 'Invite only', regClosed: 'Closed',
      invites: 'Invite codes', invNote: 'Note (e.g. for my wife)', invCreate: 'Create code', code: 'Code', note: 'Note', status: 'Status', used: 'used', unused: 'free', users: 'Users', user: 'User', role: 'Role', tasks: 'Tasks', lists: 'Lists', lastSync: 'Last sync', joined: 'Joined', audit: 'Events',
      admin: 'admin', disabled: 'disabled', never: 'never', disable: 'Disable', enable: 'Enable', makeAdmin: 'Make admin', removeAdmin: 'Remove admin', resetLink: 'Password reset link', wipe: 'Wipe data', del: 'Delete', delete: 'Delete',
      confirmDel: 'Delete this user and all their data?', confirmWipe: 'Wipe all tasks of this user?', linkMade: 'Link created (valid 24h) — send it to the user:', saved: 'Saved', errCreds: 'Wrong email or password', errForbidden: 'This account is not an admin', errNet: 'Could not connect',
      sUsers: 'users', sAdmins: 'admins', sTasks: 'tasks', sSignups: 'sign-ups 7d', sActive: 'active 7d', sDb: 'database', sMail: 'e-mail', on: 'on', off: 'off', copy: 'Copy' },
  };
  let lang = localStorage.getItem('anjam-admin-lang') || 'fa';
  const t = (k) => I[lang][k];
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const num = (n) => Number(n).toLocaleString(lang === 'fa' ? 'fa-IR' : 'en-US');
  const when = (ts) => ts ? new Intl.DateTimeFormat(lang === 'fa' ? 'fa-IR-u-ca-persian' : 'en-GB', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(ts)) : t('never');
  let token = localStorage.getItem('anjam-admin-token') || '';
  async function api(p, body) {
    const r = await fetch(p, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.error || r.status); e.code = j.error; throw e; }
    return j;
  }
  function applyLang() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  }
  async function load() {
    const [ov, us, inv, au] = await Promise.all([api('/api/admin/overview'), api('/api/admin/users'), api('/api/admin/invites'), api('/api/admin/audit')]);
    $('#stats').innerHTML = [[ov.users, 'sUsers'], [ov.tasks, 'sTasks'], [ov.signups7, 'sSignups'], [ov.active7, 'sActive']].map(([v, k]) => `<div><b>${num(v)}</b> <span>${t(k)}</span></div>`).join('')
      + `<div><b>${(ov.dbBytes / 1024).toFixed(0)} KB</b> <span>${t('sDb')}</span></div><div><b>${ov.mail ? t('on') : t('off')}</b> <span>${t('sMail')}</span></div>`;
    document.querySelectorAll('#reg button').forEach((b) => b.classList.toggle('active', b.dataset.v === ov.registration));
    $('#inv-table tbody').innerHTML = inv.invites.map((i) => `<tr><td><code>${esc(i.code)}</code></td><td dir="auto">${esc(i.note)}</td><td>${i.used_by ? `<span class="badge">${t('used')} · ${when(i.used_at)}</span>` : `<span class="badge admin">${t('unused')}</span>`}</td><td class="actions">${i.used_by ? '' : `<button class="btn ghost" data-copy="${esc(i.code)}">${t('copy')}</button>`}<button class="btn ghost danger" data-inv-del="${esc(i.code)}">${t('del')}</button></td></tr>`).join('');
    $('#users tbody').innerHTML = us.users.map((u) => `<tr>
      <td><strong dir="auto">${esc(u.name)}</strong><span class="email">${esc(u.email)}</span></td>
      <td>${u.role === 'admin' ? `<span class="badge admin">${t('admin')}</span>` : u.disabled ? `<span class="badge off">${t('disabled')}</span>` : `<span class="badge">${t('active')}</span>`}</td>
      <td class="num">${num(u.tasks)}</td><td class="num">${num(u.lists)}</td><td class="num">${when(u.last_sync_at)}</td><td class="num">${when(u.created_at)}</td>
      <td class="actions">${u.role === 'admin' ? '' : `
        <button class="btn ghost" data-act="${u.disabled ? 'enable' : 'disable'}" data-id="${u.id}">${u.disabled ? t('enable') : t('disable')}</button>
        <button class="btn ghost" data-act="reset_link" data-id="${u.id}">${t('resetLink')}</button>
        <button class="btn ghost danger" data-act="wipe_data" data-id="${u.id}">${t('wipe')}</button>
        <button class="btn ghost danger" data-act="delete" data-id="${u.id}">${t('delete')}</button>`}
      </td></tr>`).join('');
    $('#audit').innerHTML = au.audit.map((a) => `<span class="ts">${when(a.ts)}</span><span>${esc(a.action)}</span><span dir="auto">${esc(a.target)}</span><span class="ts">${esc(a.ip)}</span>`).join('');
  }
  async function enter() {
    try {
      const me = await api('/api/admin/me');
      $('#who').textContent = `${me.admin.name} · ${me.admin.email}`;
      $('#login').hidden = true; $('#panel').hidden = false; await load();
    } catch (e) { token = ''; localStorage.removeItem('anjam-admin-token'); $('#login').hidden = false; $('#panel').hidden = true; }
  }
  $('#l-go').onclick = async () => {
    $('#l-err').textContent = ''; $('#l-go').disabled = true;
    try { const r = await api('/api/admin/login', { email: $('#l-user').value.trim(), password: $('#l-pass').value }); token = r.token; localStorage.setItem('anjam-admin-token', token); $('#l-pass').value = ''; enter(); }
    catch (e) { $('#l-err').textContent = e.code === 'bad_credentials' ? t('errCreds') : e.code === 'too_many_requests' ? t('errMany') : t('errNet'); }
    finally { $('#l-go').disabled = false; }
  };
  $('#pw-btn').onclick = () => { $('#pw-panel').hidden = !$('#pw-panel').hidden; };
  $('#pw-save').onclick = async () => {
    $('#pw-msg').textContent = '';
    try { const r = await api('/api/admin/password', { currentPassword: $('#pw-cur').value, newPassword: $('#pw-new').value }); token = r.token; localStorage.setItem('anjam-admin-token', token); $('#pw-cur').value = $('#pw-new').value = ''; $('#pw-msg').textContent = t('saved'); }
    catch (e) { $('#pw-msg').textContent = e.code === 'bad_credentials' ? t('errCreds') : e.code === 'weak_password' ? t('errWeak') : t('errNet'); }
  };
  $('#l-pass').onkeydown = (e) => { if (e.key === 'Enter') $('#l-go').click(); };
  $('#logout').onclick = () => { token = ''; localStorage.removeItem('anjam-admin-token'); location.reload(); };
  $('#lang').onclick = () => { lang = lang === 'fa' ? 'en' : 'fa'; localStorage.setItem('anjam-admin-lang', lang); applyLang(); if (!$('#panel').hidden) load(); };
  $('#backup').onclick = async (e) => { e.preventDefault(); const r = await fetch('/api/admin/backup', { headers: { Authorization: 'Bearer ' + token } }); const b = await r.blob(); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'anjam-backup.sqlite'; a.click(); };
  document.querySelectorAll('#reg button').forEach((b) => b.onclick = async () => { await api('/api/admin/settings', { registration: b.dataset.v }); $('#reg-msg').textContent = t('saved'); setTimeout(() => { $('#reg-msg').textContent = ''; }, 1500); load(); });
  $('#inv-add').onclick = async () => { await api('/api/admin/invites', { note: $('#inv-note').value }); $('#inv-note').value = ''; load(); };
  document.addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.copy) { navigator.clipboard.writeText(b.dataset.copy); return; }
    if (b.dataset.invDel) { await api(`/api/admin/invites/${b.dataset.invDel}/delete`, {}); load(); return; }
    if (!b.dataset.act) return;
    const act = b.dataset.act, id = b.dataset.id;
    if (act === 'delete' && !confirm(t('confirmDel'))) return;
    if (act === 'wipe_data' && !confirm(t('confirmWipe'))) return;
    try {
      const r = await api(`/api/admin/users/${id}`, { action: act });
      if (r.link) { $('#u-msg').innerHTML = `${t('linkMade')} <code>${esc(r.link)}</code> <button class="btn ghost" data-copy="${esc(r.link)}">${t('copy')}</button>`; }
      load();
    } catch (err) { $('#u-msg').textContent = err.code || err.message; }
  });
  applyLang();
  if (token) enter();
})();
</script>
</body>
</html>
